name: CI

on:
  pull_request:
  push:

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: xcodebuild build -project Liner.xcodeproj -scheme Liner -destination 'platform=macOS'

      - name: Test
        run: xcodebuild test -project Liner.xcodeproj -scheme Liner -destination 'platform=macOS'
